[project]
name = "oilgaswatch-ai"
version = "0.1.0"
description = "Real-time detection of undesirable events in oil & gas wells to minimise losses, reduce costs, and improve safety"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "plotly>=6.0.0",
    "imbalanced-learn>=0.13.0",
    "ipykernel>=6.29.5",
    "torchmetrics>=1.6.2",
    "timm>=1.0.15",
    "tqdm>=4.67.1",
    "pydantic>=2.11",
    "PyWavelets>=1.8.0",
    "pyarrow>=20.0.0",
    "pylatex>=1.4.2",
    "statsmodels>=0.14.5",
    "requests>=2.31,<3",
    "black[jupyter]==26.5.0",
    "nbconvert",
    "nbformat",
    "dtaidistance>=2.3",
    "joblib>=1.0",
    "ipywidgets==8.1.7",
    "jupyter-client==8.6.3",
    "jupyter-core==5.8.1",
    "tornado>=6.5.5,<7",
    "Pillow>=11.0.0",
    "scikit-image>=0.25.2",
    "torch>=2.5.1, <=2.10.0",
    "torchvision>=0.22.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "matplotlib>=3.10.1",
    "pyyaml>=6.0",
    "lightgbm>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
