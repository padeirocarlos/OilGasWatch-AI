# Encoder / MoE / head hyperparameters and training schedule (src/config.py:ModelConfig).

window:
  window_s: 300.0
  stride_s: 150.0
  min_window_s: 300.0

baseline:
  backend: lightgbm   # 'lightgbm' or 'sklearn'
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  class_weight: balanced

encoder:
  hidden: 64
  n_blocks: 4
  kernel_size: 3
  dropout: 0.1

moe:
  expert_dim: 64
  n_experts: 4
  gating_hidden: 64

heads:
  transient_hidden: 64
  event_hidden: 64
  state_hidden: 32

loss:
  event: 1.0
  transient: 0.5
  state: 0.25
  focal_gamma: 2.0
  class_balanced_beta: 0.999

train:
  batch_size: 64
  epochs: 90
  lr: 1.0e-3
  weight_decay: 1.0e-4
  seed: 42
  device: auto
  ssl_epochs: 10
  ssl_mask_ratio: 0.5
